services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3001
    ports:
      - "${MCP_SERVER_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - .env
    environment:
      AGENT_PORT: 8001
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-http://localhost:8001}
      MCP_SERVER_URL: http://mcp-server:3001/mcp
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - "${AGENT_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').getcode() == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
